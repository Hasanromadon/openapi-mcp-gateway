openapi: 3.0.3
info:
  title: Bank Indonesia Fast & Open API (BI-SNAP)
  version: 1.0.0
  description: >-
    National Open API standard for Indonesian Banking & Financial Services (BI-SNAP).
    Includes Balance Inquiry, Bank Statement, and Interbank Fund Transfer.
servers:
  - url: https://api.sandbox.bank.id/bi-snap
    description: BI-SNAP Sandbox Gateway

paths:
  /v1.0/balance-inquiry:
    post:
      operationId: getAccountBalance
      tags:
        - accounts
        - inquiry
      summary: Check Account Balance (BI-SNAP)
      description: Retrieve available and ledger balance for a customer bank account. This operation is read-only. When BI-SNAP signing is enabled, the gateway generates timestamp, partner, channel, external ID, and signature headers from server configuration.
      x-mcp-annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
      parameters:
        - name: X-PARTNER-ID
          in: header
          required: false
          description: Optional BI-SNAP partner identifier. The gateway supplies its configured value when signing is enabled.
          schema:
            type: string
          example: PARTNER123
        - name: X-SIGNATURE
          in: header
          required: false
          description: BI-SNAP signature. Generated by the gateway when signing is enabled; do not provide a manual signature in that mode.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partnerReferenceNo
                - accountNo
              properties:
                partnerReferenceNo:
                  type: string
                  description: Unique client-generated reference for this balance inquiry.
                  example: REF-20261109-001
                accountNo:
                  type: string
                  description: Bank account number to inquire
                  example: '1029384756'
      responses:
        '200':
          description: Successful balance inquiry
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: '2001100'
                  responseMessage:
                    type: string
                    example: Successful
                  partnerReferenceNo:
                    type: string
                    example: REF-20261109-001
                  referenceNo:
                    type: string
                    example: BANK-TX-8839201
                  accountNo:
                    type: string
                    example: '1029384756'
                  name:
                    type: string
                    example: HASAN ROMADON
                  amount:
                    type: object
                    properties:
                      value:
                        type: string
                        example: '1500000000.00'
                      currency:
                        type: string
                        example: IDR

  /v1.0/transfer-interbank:
    post:
      operationId: transferInterbankFunds
      tags:
        - transfers
        - payments
      summary: Interbank Real-time Transfer (BI-FAST / BI-SNAP)
      description: Execute a real-time interbank transfer. This moves funds and may be irreversible; call only after the user explicitly confirms the beneficiary and amount. Configure BI-SNAP credentials on the server rather than passing secrets as tool arguments.
      x-mcp-annotations:
        readOnlyHint: false
        destructiveHint: true
        idempotentHint: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - partnerReferenceNo
                - sourceAccountNo
                - beneficiaryAccountNo
                - beneficiaryBankCode
                - amount
              properties:
                partnerReferenceNo:
                  type: string
                  description: Unique client-generated identifier for this transfer. Keep it stable when retrying the same transfer to support upstream duplicate detection.
                  example: TRF-20261109-992
                sourceAccountNo:
                  type: string
                  description: Account from which funds will be debited.
                  example: '1029384756'
                beneficiaryAccountNo:
                  type: string
                  description: Destination account that will receive the funds.
                  example: '9876543210'
                beneficiaryBankCode:
                  type: string
                  description: Central Bank 3-digit bank code
                  example: '014'
                amount:
                  type: object
                  description: Amount and currency to transfer. Confirm both with the user before submitting.
                  required:
                    - value
                    - currency
                  properties:
                    value:
                      type: string
                      description: Decimal amount to transfer, expressed as a string to preserve precision.
                      example: '50000000.00'
                    currency:
                      type: string
                      description: ISO 4217 currency code for the transfer amount.
                      example: IDR
                remark:
                  type: string
                  description: Optional payment note shown with the transaction.
                  example: Corporate Vendor Payment
      responses:
        '200':
          description: Successful transfer execution
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: '2001800'
                  responseMessage:
                    type: string
                    example: Successful Transfer
                  referenceNo:
                    type: string
                    example: BIF-20261109-88319

  /v1.0/bank-statement:
    post:
      operationId: getAccountStatement
      tags:
        - accounts
        - statements
      summary: Historical Bank Account Statement
      description: Retrieve debit and credit transactions for an account within the requested time range. This operation is read-only.
      x-mcp-annotations:
        readOnlyHint: true
        destructiveHint: false
        idempotentHint: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountNo
                - fromDateTime
                - toDateTime
              properties:
                accountNo:
                  type: string
                  description: Bank account number whose statement should be retrieved.
                  example: '1029384756'
                fromDateTime:
                  type: string
                  description: Inclusive start of the statement period in ISO 8601 format with timezone.
                  example: '2026-11-01T00:00:00+07:00'
                toDateTime:
                  type: string
                  description: Inclusive end of the statement period in ISO 8601 format with timezone.
                  example: '2026-11-08T23:59:59+07:00'
      responses:
        '200':
          description: Statement records
          content:
            application/json:
              schema:
                type: object
                properties:
                  responseCode:
                    type: string
                    example: '2001400'
                  responseMessage:
                    type: string
                    example: Successful
                  totalRecords:
                    type: integer
                    example: 24
